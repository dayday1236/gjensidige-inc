    function simplePopup(url, W, H, windowName) { // requires absolute url

        if (screen) return screen.width;
        else return 1024;
    }
    function getScreenHeight() {
        if (screen) return screen.height;

    }

    String.prototype.trim = function () {

    function disableLogin() {
        return document.loginform[3].disabled = true
    }

    function validateLogin() {
        var sUsername;
        var sPassword;
        try {
            sUsername = document.loginform.username.value;
            sPassword = document.loginform.password.value;

            document.loginform.username.value = sUsername.trim();

            if ((!sUsername) || (sUsername.trim().length <= 0) ||
                (!sPassword) || (sPassword.trim().length <= 0)) {
                alert('Password or username can not be empty!<br>Please try again.');
                return false;
            }
            return true;
        }
        catch (err) {
            alert("login.jsp err: " + err.description);
            return false;
        }
    }
